    <script>
      // In accordance with environment constraints: HMR Disabled, ignore WebSocket errors
      (function() {
        var origError = console.error;
        console.error = function() {
          var firstArg = arguments[0];
          if (typeof firstArg === 'string') {
            if (firstArg.startsWith('[vite]') || firstArg.includes('websocket') || firstArg.includes('WebSocket')) {
              return;
            }
          }
          origError.apply(console, arguments);
        };
      })();
    </script>
