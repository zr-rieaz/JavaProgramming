<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#020617" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <linearGradient id="cupGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="steamGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#fbbf24" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#fde68a" stop-opacity="0.1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Rect with subtle rounding -->
  <rect width="512" height="512" rx="104" fill="url(#bgGrad)" stroke="#334155" stroke-width="4"/>

  <!-- Subtle Outer Neon Ring -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="#f59e0b" stroke-width="2" stroke-opacity="0.25" stroke-dasharray="8 8" />

  <!-- Steam Wave 1 -->
  <path d="M 215 190 Q 200 145 225 110 Q 245 80 230 45" fill="none" stroke="url(#steamGrad)" stroke-width="14" stroke-linecap="round" filter="url(#glow)" />
  <!-- Steam Wave 2 (Middle) -->
  <path d="M 256 185 Q 275 140 250 100 Q 235 65 256 35" fill="none" stroke="url(#steamGrad)" stroke-width="16" stroke-linecap="round" filter="url(#glow)" />
  <!-- Steam Wave 3 -->
  <path d="M 297 190 Q 315 145 290 110 Q 275 80 290 45" fill="none" stroke="url(#steamGrad)" stroke-width="14" stroke-linecap="round" filter="url(#glow)" />

  <!-- Coffee Cup Body -->
  <path d="M 140 215 L 160 365 C 165 405 200 425 256 425 C 312 425 347 405 352 365 L 372 215 Z" fill="url(#cupGrad)" filter="url(#glow)" />

  <!-- Inner Cup Depth / Coffee surface -->
  <ellipse cx="256" cy="215" rx="116" ry="22" fill="#78350f" stroke="#fbbf24" stroke-width="3" />
  <ellipse cx="256" cy="215" rx="104" ry="16" fill="#451a03" />

  <!-- Cup Handle -->
  <path d="M 360 240 C 420 245 440 310 395 345 C 375 360 355 355 350 350" fill="none" stroke="#f59e0b" stroke-width="22" stroke-linecap="round" />

  <!-- Saucer / Base Plate -->
  <path d="M 120 445 C 190 470 322 470 392 445 C 405 440 395 460 375 466 C 300 488 212 488 137 466 C 117 460 107 440 120 445 Z" fill="#d97706" />

  <!-- Accent Code Brackets </> on Cup -->
  <path d="M 225 290 L 205 315 L 225 340" fill="none" stroke="#fef3c7" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 287 290 L 307 315 L 287 340" fill="none" stroke="#fef3c7" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
  <line x1="264" y1="285" x2="248" y2="345" stroke="#fef3c7" stroke-width="7" stroke-linecap="round" />
</svg>
